# DeepMindQ CI Pipeline
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  security-gate:
    name: "Blocking - Security Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run --config vitest.security.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'
      - run: test -f src/proxy.ts
      - run: test -f src/app/api/auth/login/route.ts
      - run: node scripts/api-security-scan.js

  dependency-audit:
    name: "Blocking - Dependency Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx audit-ci --moderate

  api-security-contract:
    name: "Blocking - API Security Contract"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node scripts/api-security-scan.js

  ci-path-check:
    name: "Blocking - CI Path Safety"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/no-hardcoded-paths.js

  lint-and-typecheck:
    name: "Blocking - Lint + Typecheck"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract, ci-path-check]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx eslint src/ --max-warnings 100
      - run: npx tsc --noEmit

  test-unit:
    name: "Blocking - Unit Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run --config vitest.config.ts --reporter=verbose
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-security:
    name: "Blocking - Security Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run --config vitest.security.config.ts --reporter=verbose
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-api:
    name: "Blocking - API Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: deepmindq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/deepmindq_test
      - run: npx vitest run --config vitest.api.config.ts --reporter=verbose
        env:
          CI: 'true'
          DATABASE_URL: postgresql://test:test@localhost:5432/deepmindq_test
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-database:
    name: "Blocking - Database Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: deepmindq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/deepmindq_test
      - run: npx vitest run --config vitest.database.config.ts --reporter=verbose
        env:
          CI: 'true'
          DATABASE_URL: postgresql://test:test@localhost:5432/deepmindq_test
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-integration:
    name: "Blocking - Integration Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: deepmindq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/deepmindq_test
      - run: npx vitest run --config vitest.integration.config.ts --reporter=verbose
        env:
          CI: 'true'
          DATABASE_URL: postgresql://test:test@localhost:5432/deepmindq_test
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-m5-intelligence:
    name: "Blocking - M5 Intelligence Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run --config vitest.m5.config.ts --reporter=verbose
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  build:
    name: "Blocking - Build Verification"
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - test-unit
      - test-security
      - test-api
      - test-database
      - test-integration
      - test-m5-intelligence
      - dependency-audit
      - ci-path-check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx next build
