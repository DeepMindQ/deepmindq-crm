# ═══════════════════════════════════════════════════
# DeepMindQ — Staging Deployment Pipeline
# M4 Phase 3.3 (Restructured for Vercel Preview Deployments)
#
# Architecture: Vercel Hobby — Preview Deployments serve as staging
# No separate staging project. develop branch pushes create preview deployments
# on the same Vercel project. Neon provides separate staging database.
#
# Trigger: Push to develop branch
# Flow: Build → Migrate (staging DB) → Preview Deploy → Smoke → Health
#   CI gate temporarily disabled for M4 Phase 3 validation
#
# GATES:
#   1. Build must succeed with staging env vars
#   2. Database migration on staging Neon database
#   3. Preview deployment created (not promoted to production)
#   4. Smoke test suite passes
#   5. Health endpoint validates
# ═══════════════════════════════════════════════════
name: Deploy Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true  # Cancel redundant staging deploys

env:
  NODE_VERSION: '22'

jobs:
  # ═══════════════════════════════════════════════════
  # NOTE: CI gate temporarily disabled for M4 Phase 3 validation
  # Re-enable by uncommenting ci-gate and adding needs: [ci-gate]
  # ═══════════════════════════════════════════════════

  # ═══════════════════════════════════════════════════
  # STAGE 1: Staging Build (CI gate bypassed for validation)
  # ═══════════════════════════════════════════════════
  build-staging:
    name: "Staging — Build"
    runs-on: ubuntu-latest
    needs: []
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build:vercel
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.STAGING_NEXTAUTH_SECRET }}
          AUTHORIZED_EMAIL: ${{ secrets.STAGING_AUTHORIZED_EMAIL }}

  # ═══════════════════════════════════════════════════
  # STAGE 3: Database Migration (Staging Neon)
  # ═══════════════════════════════════════════════════
  migrate-staging:
    name: "Staging — Database Migration"
    runs-on: ubuntu-latest
    needs: [build-staging]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Check pending migrations
        run: |
          PENDING=$(npx prisma generate --quiet 2>/dev/null && npx prisma migrate status 2>&1 | grep -c "DRIFT\|Pending" || true)
          echo "Pending migrations: ${PENDING}"
          if [ "${PENDING}" = "0" ]; then
            echo "No pending migrations — skipping"
          fi
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}
      - name: Run database migration
        run: |
          # Handle P3005 (database not empty, no migration history) by resolving baseline
          OUTPUT=$(npx prisma migrate deploy 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "P3005"; then
            echo "Database schema exists but no migration history — baselining..."
            npx prisma migrate resolve --applied 20260701000000_init_baseline
            echo "✅ Baseline resolved successfully"
          elif echo "$OUTPUT" | grep -q "error\|Error"; then
            echo "❌ Migration failed"
            exit 1
          else
            echo "✅ Migration applied successfully"
          fi
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.STAGING_DIRECT_DATABASE_URL }}

  # ═══════════════════════════════════════════════════
  # STAGE 4: Deploy to Vercel (Preview Deployment)
  # Uses the SAME project as production but creates a
  # preview deployment (not promoted to production).
  # Vercel generates a unique preview URL automatically.
  # ═══════════════════════════════════════════════════
  deploy-staging:
    name: "Staging — Preview Deploy"
    runs-on: ubuntu-latest
    needs: [migrate-staging]
    timeout-minutes: 10
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel (Preview)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # NO --prod flag → creates a preview deployment
          # NO alias-domains → Vercel auto-generates preview URL
        env:
          VERCEL_ENV: preview

  # ═══════════════════════════════════════════════════
  # STAGE 5: Smoke Tests
  # ═══════════════════════════════════════════════════
  smoke-test-staging:
    name: "Staging — Smoke Tests"
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Run smoke tests against staging preview
        run: npx vitest run --config vitest.smoke.config.ts
        env:
          SMOKE_TEST_URL: ${{ needs.deploy-staging.outputs.deployment_url }}
          SMOKE_TEST_ENV: staging

  # ═══════════════════════════════════════════════════
  # STAGE 6: Health Validation
  # ═══════════════════════════════════════════════════
  health-check-staging:
    name: "Staging — Health Check"
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    timeout-minutes: 2
    steps:
      - name: Validate health endpoint
        run: |
          DEPLOY_URL="${{ needs.deploy-staging.outputs.deployment_url }}"
          HEALTH_URL="${DEPLOY_URL}/api/health"

          echo "Checking health endpoint: ${HEALTH_URL}"

          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/health-response.json -w "%{http_code}" --max-time 10 "${HEALTH_URL}")
            echo "Attempt ${i}: HTTP ${HTTP_CODE}"
            cat /tmp/health-response.json

            if [ "${HTTP_CODE}" = "200" ]; then
              STATUS=$(python3 -c "import json; print(json.load(open('/tmp/health-response.json')).get('status',''))" 2>/dev/null || echo "")
              DB=$(python3 -c "import json; print(json.load(open('/tmp/health-response.json')).get('db',''))" 2>/dev/null || echo "")

              echo "Status: ${STATUS} | DB: ${DB}"

              if [ "${STATUS}" = "ok" ]; then
                echo "✅ Health check passed"
                exit 0
              fi
            fi

            echo "Retrying in 15 seconds..."
            sleep 15
          done

          echo "::error::Health check failed after 3 attempts"
          exit 1

  # ═══════════════════════════════════════════════════
  # STAGE 7: Deployment Summary
  # ═══════════════════════════════════════════════════
  staging-summary:
    name: "Staging — Summary"
    runs-on: ubuntu-latest
    needs: [smoke-test-staging, health-check-staging]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Deployment summary
        run: |
          echo "============================================"
          echo "  STAGING PREVIEW DEPLOYMENT SUMMARY"
          echo "============================================"
          echo "  Commit:     ${{ github.sha }}"
          echo "  Branch:     ${{ github.ref_name }}"
          echo "  Smoke:      ${{ needs.smoke-test-staging.result }}"
          echo "  Health:     ${{ needs.health-check-staging.result }}"
          echo "============================================"
          echo ""
          echo "To promote to production:"
          echo "  1. Verify staging preview deployment"
          echo "  2. Create PR: develop → main"
          echo "  3. Approve after review"
          echo "  4. Production pipeline auto-deploys on merge"
          echo "============================================"
