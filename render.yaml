# Render Blueprint — explicit deployment configuration
# https://docs.render.com/blueprint-spec
#
# AUTO-DETECTED ONLY ON NEW SERVICE CREATION.
# If you already have a Render web service, you must either:
#   1. Delete and recreate it (it will auto-detect this file), OR
#   2. Manually set Build Command and Start Command in Render dashboard
#      to match the values below.
#
# Required env vars (set in Render dashboard → Environment):
#   - DATABASE_URL     (from Render Postgres or external — see `databases:` below)
#   - NEXTAUTH_SECRET  (auto-generated by `generateValue: true` below)
#   - ZAI_API_KEY      (GLM-4.6 — Deep tier, get from https://z.ai/)
#   - GEMINI_API_KEY   (Gemini 2.0 Flash — Smart tier, get from https://aistudio.google.com/)
#   - GROQ_API_KEY     (Llama 3.3 70B / 3.1 8B — Fast tier, get from https://console.groq.com/)
#
# Optional (engines degrade gracefully if missing):
#   - ZAI_BASE_URL, ZAI_TOKEN, ZAI_CHAT_ID, ZAI_USER_ID (alt Z.ai auth)
#   - SMTP_* (transactional email)
#   - S3_*  (file attachments)

databases:
  - name: deepmindq-postgres
    databaseName: deepmindq
    plan: starter
    ipAllowList: []   # allow connections from Render services only

services:
  - type: web
    name: deepmindq-crm
    runtime: node
    plan: starter
    # CRITICAL: use build:vercel (NOT build). The `build` script runs
    # `prisma db push` which requires DATABASE_URL to be reachable at
    # build time — fails on first deploy when Postgres isn't ready yet.
    # build:vercel only does `prisma generate + next build` (no DB access).
    # DB schema is pushed post-deploy via POST /api/setup-db.
    buildCommand: npm install && npm run build:vercel
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: deepmindq-postgres
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        fromService:
          name: deepmindq-crm
          type: web
          property: hostport
      # ── Zero-budget AI providers (set values manually in Render dashboard) ──
      - key: ZAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
