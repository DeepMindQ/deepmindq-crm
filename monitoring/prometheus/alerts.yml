groups:
  - name: deepmindq_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(deepmindq_http_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} requests/sec (> 0.1)"

      - alert: HighMemoryUsage
        expr: deepmindq_heap_usage_percent > 85
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High memory usage"
          description: "Heap usage at {{ $value }}%"

      - alert: SlowDatabaseQueries
        expr: deepmindq_db_query_latency_p95_ms > 200
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow database queries"
          description: "DB P95 latency is {{ $value }}ms"

      - alert: HighAILatency
        expr: deepmindq_ai_provider_circuit_breaker_open > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "AI provider circuit breaker open"
          description: "{{ $value }} AI provider(s) have open circuit breakers"

      - alert: MemoryLeakDetected
        expr: deepmindq_memory_growth_rate_mb_per_min > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Possible memory leak"
          description: "Memory growing at {{ $value }} MB/min"

      - alert: DatabaseConnectionExhaustion
        expr: deepmindq_db_connections_active >= deepmindq_db_connections_max * 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "{{ $value }} active connections"
