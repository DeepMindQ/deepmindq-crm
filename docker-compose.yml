# ──────────────────────────────────────────────────────────────
# DeepMindQ — Docker Compose (local development / self-hosted)
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose logs -f app    # Follow app logs
#   docker compose down -v       # Stop and remove volumes
#
# Prerequisites:
#   1. Copy .env.example to .env and fill in values
#   2. Ensure port 3000 (app) and 5432 (postgres) are available
# ──────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-deepmindq}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deepmindq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── DeepMindQ Application ───────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-deepmindq}?schema=public
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-deepmindq}?schema=public
      # Auth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET is required (min 32 chars)}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Node
      NODE_ENV: production
      PORT: "3000"
      # AI Providers (passed through from host .env)
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      # Email (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # Required secrets
      AUTHORIZED_EMAIL: ${AUTHORIZED_EMAIL:?AUTHORIZED_EMAIL is required}
      TRACKING_SECRET: ${TRACKING_SECRET:?TRACKING_SECRET is required}
      CRON_SECRET: ${CRON_SECRET:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@deepmindq.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Scheduled Backup (daily at 2 AM) ─────────────────
  backup:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - backup_data:/backups
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-deepmindq}
      BACKUP_DIR: /backups
      DB_NAME: ${POSTGRES_DB:-deepmindq}
    entrypoint: >
      sh -c "
        echo 'Waiting for postgres...' && sleep 10 &&
        echo 'Running backup...' &&
        BACKUP_FILE=/backups/deepmindq-$$(date +%Y%m%d-%H%M%S).sql.gz &&
        pg_dump -h postgres -U $${POSTGRES_USER} -d $${POSTGRES_DB} --compress=9 > $${BACKUP_FILE} &&
        echo 'Backup created:' $${BACKUP_FILE} &&
        echo 'Keeping last 30 backups...' &&
        ls -t /backups/deepmindq-*.sql.gz | tail -n +31 | xargs rm -f 2>/dev/null || true &&
        echo 'Done.'
      "

volumes:
  postgres_data:
    driver: local
  backup_data:
    driver: local
