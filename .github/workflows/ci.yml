name: CI — Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: TypeScript + ESLint + Governance ──
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint + Governance
        run: npm run lint

  # ── Job 2: Test Suite ──
  test:
    name: Tests (996 expected)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate

      - name: Run tests
        run: npx vitest run

  # ── Job 3: Build ──
  build:
    name: Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build:vercel
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ── Job 4: WCAG Grep Audit ──
  wcag:
    name: WCAG 2.2 AA Quick Audit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: WCAG checks
        run: |
          echo "=== WCAG 2.2 AA Quick Audit ==="
          FAIL=0

          # focus-visible
          if ! rg -q ':focus-visible' src/app/globals.css; then
            echo "❌ FAIL: focus-visible missing in globals.css"
            FAIL=$((FAIL+1))
          else
            echo "✅ PASS: focus-visible"
          fi

          # skip-to-content
          if ! rg -q 'skip-to-content' src/components/app-shell.tsx; then
            echo "❌ FAIL: skip-to-content missing"
            FAIL=$((FAIL+1))
          else
            echo "✅ PASS: skip-to-content"
          fi

          # forced-colors
          if ! rg -q 'forced-colors' src/app/globals.css; then
            echo "❌ FAIL: forced-colors missing"
            FAIL=$((FAIL+1))
          else
            echo "✅ PASS: forced-colors"
          fi

          # prefers-reduced-motion
          if ! rg -q 'prefers-reduced-motion' src/app/globals.css; then
            echo "❌ FAIL: prefers-reduced-motion missing"
            FAIL=$((FAIL+1))
          else
            echo "✅ PASS: prefers-reduced-motion"
          fi

          # text-[10px] violations (below 11px minimum)
          TEXT_10PX=$(rg -c 'text-\[10px\]' src/ --type ts --type tsx 2>/dev/null | awk -F: '{sum+=$2} END {print sum+0}')
          if [ "$TEXT_10PX" -gt 0 ]; then
            echo "❌ FAIL: ${TEXT_10PX} text-[10px] violations (WCAG min 11px)"
            FAIL=$((FAIL+1))
          else
            echo "✅ PASS: text-min-11px"
          fi

          # Auth proxy exists
          if [ ! -f "src/proxy.ts" ]; then
            echo "❌ FAIL: proxy.ts missing (auth enforcement)"
            FAIL=$((FAIL+1))
          else
            echo "✅ PASS: auth-proxy"
          fi

          echo ""
          echo "Total WCAG failures: ${FAIL}"
          exit $FAIL

  # ── Job 5: Regression Check ──
  regression:
    name: Baseline Regression Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Check for regression vs baseline
        run: |
          echo "=== Regression Check ==="
          if [ -f "error-snapshots/baseline-v1.json" ]; then
            echo "Baseline found — comparing..."
            # Parse baseline expectations
            TSC_EXPECTED=$(jq -r '.checks.typescript.errors' error-snapshots/baseline-v1.json)
            LINT_EXPECTED=$(jq -r '.checks.eslint.errors' error-snapshots/baseline-v1.json)
            TEST_FAIL_EXPECTED=$(jq -r '.checks.tests.failed' error-snapshots/baseline-v1.json)
            echo "Baseline expects: TSC=${TSC_EXPECTED} errors, LINT=${LINT_EXPECTED} errors, TEST_FAIL=${TEST_FAIL_EXPECTED}"
          else
            echo "⚠️ No baseline found — skipping regression check"
          fi

  # ── Merge Gate: All jobs must pass ──
  quality-gate:
    name: ✅ Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, test, build, wcag]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "Lint: ${{ needs.lint.result }}"
          echo "Tests: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "WCAG: ${{ needs.wcag.result }}"
          echo ""

          if [ "${{ needs.lint.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.wcag.result }}" = "success" ]; then
            echo "✅ ALL QUALITY GATES PASSED"
            exit 0
          else
            echo "❌ QUALITY GATE FAILED — one or more jobs did not pass"
            exit 1
          fi
