version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "maintainer"
    labels:
      - "dependencies"
      - "security"
    allow:
      - dependency-type: "direct"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    vulnerability-alerts: true
