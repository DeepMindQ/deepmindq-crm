# ====================================================================
# DeepMindQ -- Enterprise Test Architecture CI Pipeline
# Deterministic execution + path safety
# ====================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  security-gate:
    name: "Blocking -- Security Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run security gate regression tests
        run: npx vitest run --config vitest.security.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'
      - name: Verify edge proxy exists
        run: |
          if [ ! -f "src/proxy.ts" ]; then
            echo "::error::SECURITY GATE FAILED -- src/proxy.ts is missing"
            exit 1
          fi
      - name: Verify CSRF flow integrity
        run: |
          if ! grep -q "validateCsrf" src/proxy.ts 2>/dev/null; then
            echo "::error::SECURITY GATE FAILED -- CSRF validation missing"
            exit 1
          fi
          if ! grep -q "generateCsrfToken" src/lib/csrf.ts 2>/dev/null; then
            echo "::error::SECURITY GATE FAILED -- CSRF token generation missing"
            exit 1
          fi
          if ! grep -q "timingSafeEqual" src/lib/csrf.ts 2>/dev/null; then
            echo "::error::SECURITY GATE FAILED -- Timing-safe comparison missing"
            exit 1
          fi
      - name: Verify security headers
        run: |
          if ! grep -q "X-Content-Type-Options" src/proxy.ts 2>/dev/null; then
            echo "::error::SECURITY GATE FAILED -- Security headers missing"
            exit 1
          fi
      - name: Verify DOMPurify
        run: |
          if ! grep -q "isomorphic-dompurify" src/lib/sanitize.ts 2>/dev/null; then
            echo "::error::SECURITY GATE FAILED -- DOMPurify missing"
            exit 1
          fi
      - name: Verify AuthProvider session enforcement
        run: |
          if ! grep -q "AuthProvider" src/providers/auth-provider.tsx 2>/dev/null; then
            echo "::error::SECURITY GATE FAILED -- AuthProvider missing"
            exit 1
          fi
      - name: Verify environment validation
        run: |
          if ! grep -q "API_KEY_ENCRYPTION_KEY" src/lib/validate-env.ts 2>/dev/null; then
            echo "::error::SECURITY GATE FAILED -- Environment validation missing"
            exit 1
          fi

  dependency-audit:
    name: "Blocking -- Dependency Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node scripts/dependency-audit-ci.js

  api-security-contract:
    name: "Blocking -- API Security Contract"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run API Security Contract Scanner
        run: node scripts/api-security-scan.js

  ci-path-check:
    name: "Blocking -- CI Path Safety"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan for hardcoded environment paths
        run: node scripts/no-hardcoded-paths.js

  lint-and-typecheck:
    name: "Blocking -- Lint + Typecheck"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract, ci-path-check]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx eslint src/ --max-warnings 100
      - run: npx tsc --noEmit

  test-unit:
    name: "Blocking -- Unit Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run --config vitest.config.ts --reporter=verbose
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-security:
    name: "Blocking -- Security Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run --config vitest.security.config.ts --reporter=verbose
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-api:
    name: "Blocking -- API Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: deepmindq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/deepmindq_test
      - run: npx vitest run --config vitest.api.config.ts --reporter=verbose
        env:
          CI: 'true'
          DATABASE_URL: postgresql://test:test@localhost:5432/deepmindq_test
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-database:
    name: "Blocking -- Database Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: deepmindq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/deepmindq_test
      - run: npx vitest run --config vitest.database.config.ts --reporter=verbose
        env:
          CI: 'true'
          DATABASE_URL: postgresql://test:test@localhost:5432/deepmindq_test
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-integration:
    name: "Blocking -- Integration Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: deepmindq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/deepmindq_test
      - run: npx vitest run --config vitest.integration.config.ts --reporter=verbose
        env:
          CI: 'true'
          DATABASE_URL: postgresql://test:test@localhost:5432/deepmindq_test
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-m5-intelligence:
    name: "Blocking -- M5 Intelligence Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run --config vitest.m5.config.ts --reporter=verbose
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  build:
    name: "Blocking -- Build Verification"
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - test-unit
      - test-security
      - test-api
      - test-database
      - test-integration
      - test-m5-intelligence
      - dependency-audit
      - ci-path-check
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx next build
