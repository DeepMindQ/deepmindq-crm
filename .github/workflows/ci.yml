# DeepMindQ CI Pipeline
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  security-gate:
    name: "Blocking - Security Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx vitest run --config vitest.security.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  lint-and-typecheck:
    name: "Blocking - Lint + Typecheck"
    runs-on: ubuntu-latest
    needs: [security-gate]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx eslint src/ --max-warnings 100
      - run: npx tsc --noEmit

  build:
    name: "Blocking - Build Verification"
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx next build
