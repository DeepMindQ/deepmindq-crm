name: DeepMindQ CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck 2>&1 | head -50
        continue-on-error: true

      - name: Run intelligence-critical tests
        run: npx vitest run --reporter=verbose src/lib/intelligence-sources/__tests__/ src/lib/ai-copilot/__tests__/ tests/sprint1-modules.test.ts --passWithNoTests 2>&1 | tail -30
        continue-on-error: true

      - name: Run all tests
        run: npx vitest run --reporter=verbose --passWithNoTests 2>&1 | tail -30
        continue-on-error: true

      - name: Build check
        run: npx next build --webpack 2>&1 | tail -20
        continue-on-error: true

  deploy-verification:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Verify deployment trigger
        run: echo "Push to main — Vercel auto-deploy will be triggered via GitHub integration"
