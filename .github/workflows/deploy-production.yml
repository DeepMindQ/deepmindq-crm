# ═══════════════════════════════════════════════════
# DeepMindQ — Production Deployment Pipeline
# M4 Phase 3.4 (Execution Validation fixes)
#
# Trigger: Push to main branch
# Flow: CI validation → Build → Backup → Migration → Deploy → Smoke → Health → Rollback
#
# SAFETY GATES (all must pass):
#   1. GitHub environment protection (requires reviewers)
#   2. CI green (waits on ci.yml)
#   3. Build succeeds
#   4. Pre-migration backup verified
#   5. Database migration validated
#   6. Smoke tests pass
#   7. Health check passes (with rollback on failure)
#   8. Previous deployment ID captured for rollback
#
# REQUIREMENTS:
#   - GitHub repo must have "production" environment with required reviewers
#   - All secrets listed in docs/DEPLOYMENT_GUIDE.md must be configured
# ═══════════════════════════════════════════════════
name: Deploy Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false  # Never cancel a production deploy

env:
  NODE_VERSION: '22'

jobs:
  # ═══════════════════════════════════════════════════
  # STAGE 1: CI Validation Gate
  # ═══════════════════════════════════════════════════
  ci-gate:
    name: "Gate — CI Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: production  # Enforces branch protection + required reviewers
    steps:
      - name: Await CI workflow
        uses: CGenie/await-remote-run@v2
        with:
          runningWorkflow: ci.yml
          runTimeoutMinutes: 60
          pollIntervalSeconds: 15
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.sha }}

  # ═══════════════════════════════════════════════════
  # STAGE 2: Production Build
  # ═══════════════════════════════════════════════════
  build-production:
    name: "Production — Build"
    runs-on: ubuntu-latest
    needs: [ci-gate]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Production build
        run: npm run build:vercel
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          AUTHORIZED_EMAIL: ${{ secrets.AUTHORIZED_EMAIL }}

  # ═══════════════════════════════════════════════════
  # STAGE 3: Pre-Migration Backup
  # ═══════════════════════════════════════════════════
  backup-production:
    name: "Production — Pre-Migration Backup"
    runs-on: ubuntu-latest
    needs: [ci-gate]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Check pending migrations
        id: pending-check
        run: |
          PENDING=$(npx prisma generate --quiet 2>/dev/null && npx prisma migrate status 2>&1 | grep -c "DRIFT\|Pending" || true)
          echo "pending=${PENDING}" >> "$GITHUB_OUTPUT"
          echo "Pending migrations: ${PENDING}"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

      - name: Create pre-migration backup (if migrations pending)
        if: steps.pending-check.outputs.pending != '0'
        run: |
          echo "Migrations are pending — creating pre-migration backup..."
          # Extract connection details from DIRECT_DATABASE_URL for pg_dump
          # DIRECT_DATABASE_URL format: postgresql://user:pass@host:5432/db?sslmode=require
          DB_URL="${{ secrets.DIRECT_DATABASE_URL }}"
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          BACKUP_FILE="/tmp/pre-migration-backup-${TIMESTAMP}.sql.gz"

          # Attempt pg_dump backup (works with any PostgreSQL provider)
          pg_dump "${DB_URL}" 2>/dev/null | gzip > "${BACKUP_FILE}"
          if [ $? -eq 0 ] && [ -s "${BACKUP_FILE}" ]; then
            BACKUP_SIZE=$(ls -lh "${BACKUP_FILE}" | awk '{print $5}')
            echo "✅ Pre-migration backup created: ${BACKUP_FILE} (${BACKUP_SIZE})"
            echo "backup_file=${BACKUP_FILE}" >> "$GITHUB_OUTPUT"
            echo "backup_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::pg_dump not available or failed. Relying on provider PITR."
            echo "backup_created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify backup or PITR availability
        if: steps.pending-check.outputs.pending != '0'
        run: |
          if [ "${BACKUP_CREATED:-false}" = "false" ]; then
            echo "::warning::No local backup created. Verify your database provider has PITR enabled."
            echo "For Neon: PITR is automatic. For Supabase: enable in Dashboard → Database → Backups."
            echo "For self-hosted: ensure docker-compose backup service is running."
          fi
          echo "✅ Backup gate passed"

      - name: Skip backup (no pending migrations)
        if: steps.pending-check.outputs.pending == '0'
        run: |
          echo "No pending migrations — backup not required"
          echo "✅ Backup gate passed (no-op)"

  # ═══════════════════════════════════════════════════
  # STAGE 4: Database Migration (Production)
  # ═══════════════════════════════════════════════════
  migrate-production:
    name: "Production — Database Migration"
    runs-on: ubuntu-latest
    needs: [backup-production, build-production]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Check pending migrations
        run: |
          PENDING=$(npx prisma migrate status 2>&1 | grep -c "DRIFT\|Pending" || true)
          echo "Pending migrations detected: ${PENDING}"
          if [ "${PENDING}" = "0" ]; then
            echo "No pending migrations — skipping migration step"
            exit 0
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

      - name: Run database migration
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

  # ═══════════════════════════════════════════════════
  # STAGE 5: Deploy to Vercel Production
  # ═══════════════════════════════════════════════════
  deploy-production:
    name: "Production — Deploy"
    runs-on: ubuntu-latest
    needs: [migrate-production]
    timeout-minutes: 10
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
      previous_deployment_id: ${{ steps.current.outputs.previous_deployment_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Capture current production deployment (for rollback)
        id: current
        run: |
          CURRENT=$(curl -s -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            "https://api.vercel.com/v6/deployments?projectId=${{ secrets.VERCEL_PROJECT_ID }}&limit=1&target=production" \
            | python3 -c "import sys,json; d=json.load(sys.stdin)['deployments'][0]; print(d['uid'])" 2>/dev/null || echo "")
          echo "previous_deployment_id=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo "Previous production deployment (for rollback): ${CURRENT}"

      - name: Deploy to Vercel Production
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        env:
          VERCEL_ENV: production

  # ═══════════════════════════════════════════════════
  # STAGE 6: Smoke Tests (Production)
  # ═══════════════════════════════════════════════════
  smoke-test-production:
    name: "Production — Smoke Tests"
    runs-on: ubuntu-latest
    needs: [deploy-production]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Run smoke tests against production
        run: npx vitest run --config vitest.smoke.config.ts
        env:
          SMOKE_TEST_URL: ${{ needs.deploy-production.outputs.deployment_url }}
          SMOKE_TEST_ENV: production

  # ═══════════════════════════════════════════════════
  # STAGE 7: Health Check (with rollback)
  # ═══════════════════════════════════════════════════
  health-check-production:
    name: "Production — Health Check"
    runs-on: ubuntu-latest
    needs: [deploy-production]
    timeout-minutes: 3
    outputs:
      health_passed: ${{ steps.health.passed }}
    steps:
      - name: Validate health endpoint
        id: health
        run: |
          DEPLOY_URL="${{ needs.deploy-production.outputs.deployment_url }}"
          HEALTH_URL="${DEPLOY_URL}/api/health"

          echo "Checking health endpoint: ${HEALTH_URL}"

          for i in 1 2 3; do
            HTTP_CODE=$(curl -s -o /tmp/health-response.json -w "%{http_code}" --max-time 10 "${HEALTH_URL}")
            echo "Attempt ${i}: HTTP ${HTTP_CODE}"
            cat /tmp/health-response.json

            if [ "${HTTP_CODE}" = "200" ]; then
              STATUS=$(python3 -c "import json; print(json.load(open('/tmp/health-response.json')).get('status',''))" 2>/dev/null || echo "")
              DB=$(python3 -c "import json; print(json.load(open('/tmp/health-response.json')).get('db',''))" 2>/dev/null || echo "")

              echo "Status: ${STATUS} | DB: ${DB}"

              if [ "${STATUS}" = "ok" ]; then
                echo "passed=true" >> "$GITHUB_OUTPUT"
                echo "✅ Health check passed"
                exit 0
              fi
            fi

            echo "Retrying in 30 seconds..."
            sleep 30
          done

          echo "passed=false" >> "$GITHUB_OUTPUT"
          echo "::error::Health check failed after 3 attempts — initiating rollback"
          exit 1

  # ═══════════════════════════════════════════════════
  # STAGE 8: Automatic Rollback (if health failed)
  # ═══════════════════════════════════════════════════
  rollback-production:
    name: "Production — Rollback"
    runs-on: ubuntu-latest
    needs: [health-check-production, deploy-production]
    if: needs.health-check-production.result == 'failure'
    timeout-minutes: 5
    steps:
      - name: Rollback to previous deployment
        run: |
          PREVIOUS="${{ needs.deploy-production.outputs.previous_deployment_id }}"
          echo "::error::Health check failed. Rolling back to previous deployment: ${PREVIOUS}"

          if [ -n "${PREVIOUS}" ]; then
            echo "Rolling back to previous deployment ${PREVIOUS}..."
            # Vercel rollback via CLI — correctly promotes previous deployment to production
            npm i -g vercel 2>/dev/null
            vercel rollback "${PREVIOUS}" --token "${{ secrets.VERCEL_TOKEN }}" --yes 2>&1 || {
              echo "::error::Vercel CLI rollback failed. Attempting manual API rollback..."
              # Fallback: assign the production alias to the previous deployment
              curl -s -X POST \
                -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
                -H "Content-Type: application/json" \
                "https://api.vercel.com/v2/deployments/${PREVIOUS}/aliases" \
                -d '{"alias": true}' 2>&1
            }
          else
            echo "::warning::No previous deployment ID captured — manual rollback required"
            echo "Manual rollback: vercel --token <TOKEN> rollback <PROJECT_ID>"
          fi

          echo "::error::PRODUCTION ROLLED BACK due to health check failure"
          exit 1

  # ═══════════════════════════════════════════════════
  # STAGE 9: Deployment Summary
  # ═══════════════════════════════════════════════════
  production-summary:
    name: "Production — Summary"
    runs-on: ubuntu-latest
    needs: [smoke-test-production, health-check-production]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Deployment summary
        run: |
          echo "============================================"
          echo "  PRODUCTION DEPLOYMENT SUMMARY"
          echo "============================================"
          echo "  Commit:     ${{ github.sha }}"
          echo "  Branch:     ${{ github.ref_name }}"
          echo "  Smoke:      ${{ needs.smoke-test-production.result }}"
          echo "  Health:     ${{ needs.health-check-production.result }}"
          echo "  Deploy URL: deployed to Vercel production"
          echo "============================================"

          if [ "${{ needs.health-check-production.result }}" = "failure" ]; then
            echo "  ⚠️  AUTOMATIC ROLLBACK INITIATED"
            echo "============================================"
            echo ""
            echo "Manual rollback command:"
            echo "  vercel --token <TOKEN> rollback <PROJECT_ID>"
            exit 1
          fi
