# ═══════════════════════════════════════════════════
# DeepMindQ — Enterprise Test Architecture CI Pipeline
# Phase 5.5 — Independent test jobs, sharding support
#
# Architecture: Each test category runs as an independent job
# with dedicated memory, fresh runner, and clear failure isolation.
#
# Jobs:
#   1. security-gate     — Permanent security regression gates
#   2. dependency-audit  — npm dependency vulnerability scan
#   3. api-security-contract — Static API auth guard verification
#   4. lint-and-typecheck — ESLint + TypeScript
#   5. test-unit          — Pure logic unit tests (node)
#   6. test-security     — Auth/CSRF/RBAC security tests (node)
#   7. test-api           — API route handler tests (node) + PostgreSQL service
#   8. test-database      — Database/Prisma tests (node)
#   9. test-ai            — AI engine core tests (node)
#   9a. test-ai-governance — AI governance, prompt registry, config coverage (node)
#   9b. test-ai-retrieval  — AI retrieval, hybrid search, knowledge graph (node)
#   9c. test-ai-framework — AI agent framework, memory, evaluation engine (node)
#   9d. test-ai-inference — AI hallucination, confidence, recommendation engine (node)
#   10. test-integration  — Cross-module integration tests (node)
#   11. test-e2e          — End-to-end business journey tests (node)
#   12. test-performance  — Benchmarks/scale/memory tests (node, single-thread)
#   13. test-ui            — React component tests (jsdom)
#   14. build             — Final build verification
# ═══════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ═══════════════════════════════════════════════════
  # JOB 1: SECURITY REGRESSION GATE
  # ═══════════════════════════════════════════════════
  security-gate:
    name: Security Regression Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Run security gate regression tests
        run: npx vitest run --config vitest.security.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

      - name: Verify edge proxy exists
        run: |
          if [ ! -f "src/proxy.ts" ]; then
            echo "::error::SECURITY GATE FAILED — src/proxy.ts is missing"
            exit 1
          fi

      - name: Verify CSRF flow integrity
        run: |
          FAIL=0
          echo "Checking CSRF flow integrity..."
          ls -la src/lib/csrf.ts src/proxy.ts src/lib/fetchApi.ts src/lib/auth-helpers.ts 2>&1 || { echo "::error::CSRF source files missing"; FAIL=1; }
          if ! grep -q "generateCsrfToken" src/lib/csrf.ts; then echo "::error::CSRF gen missing from csrf.ts"; FAIL=1; else echo "OK: generateCsrfToken found"; fi
          if ! grep -q "timingSafeEqual" src/lib/csrf.ts; then echo "::error::CSRF timing missing from csrf.ts"; FAIL=1; else echo "OK: timingSafeEqual found"; fi
          if ! grep -q "validateCsrf" src/proxy.ts; then echo "::error::Proxy CSRF missing from proxy.ts"; FAIL=1; else echo "OK: validateCsrf found in proxy.ts"; fi
          if ! grep -q "x-csrf-token" src/lib/fetchApi.ts; then echo "::error::fetchApi CSRF missing from fetchApi.ts"; FAIL=1; else echo "OK: x-csrf-token found in fetchApi.ts"; fi
          if ! grep -q "validateCsrf" src/lib/auth-helpers.ts; then echo "::error::auth-helpers CSRF missing from auth-helpers.ts"; FAIL=1; else echo "OK: validateCsrf found in auth-helpers.ts"; fi
          echo "FAIL=$FAIL"
          [ "$FAIL" -eq 1 ] && exit 1

      - name: Verify AI route authentication
        run: |
          FAIL=0
          for route in src/app/api/ai/*/route.ts src/app/api/ai/*/*/route.ts; do
            if [ -f "$route" ] && ! grep -q "checkApiAuth" "$route"; then
              echo "::error::$route has no auth guard"; FAIL=1
            fi
          done
          [ "$FAIL" -eq 1 ] && exit 1

      - name: Verify security headers
        run: |
          FAIL=0
          for header in X-Content-Type-Options X-Frame-Options Strict-Transport-Security Content-Security-Policy Referrer-Policy; do
            if ! grep -q "$header" src/lib/auth-helpers.ts; then echo "::error::$header missing"; FAIL=1; fi
          done
          [ "$FAIL" -eq 1 ] && exit 1

      - name: Verify DOMPurify
        run: |
          if ! grep -q "isomorphic-dompurify" src/lib/sanitize.ts; then
            echo "::error::DOMPurify not found"; exit 1
          fi

      - name: Verify CSP policy
        run: |
          if grep -q "unsafe-inline" src/lib/auth-helpers.ts; then
            SCRIPT_LINE=$(grep "script-src" src/lib/auth-helpers.ts | grep -v "unsafe-eval")
            if echo "$SCRIPT_LINE" | grep -q "unsafe-inline"; then
              echo "::error::unsafe-inline in script-src"; exit 1
            fi
          fi

      - name: Verify AuthProvider session
        run: |
          FAIL=0
          if ! grep -q "/api/auth/me" src/providers/auth-provider.tsx; then echo "::error::AuthProvider no session check"; FAIL=1; fi
          if ! grep -q "window.location.href" src/providers/auth-provider.tsx; then echo "::error::AuthProvider no redirect"; FAIL=1; fi
          [ "$FAIL" -eq 1 ] && exit 1

      - name: Verify environment validation
        run: |
          FAIL=0
          if ! grep -q "API_KEY_ENCRYPTION_KEY" src/lib/validate-env.ts; then echo "::error::validate-env no encryption key"; FAIL=1; fi
          if ! grep -q "PLAINTEXT" src/lib/validate-env.ts; then echo "::error::validate-env no plaintext warning"; FAIL=1; fi
          if ! grep -q "throw new Error" src/lib/validate-env.ts; then echo "::error::validate-env no throw"; FAIL=1; fi
          [ "$FAIL" -eq 1 ] && exit 1

  # ═══════════════════════════════════════════════════
  # JOB 2: DEPENDENCY SECURITY AUDIT
  # ═══════════════════════════════════════════════════
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/dependency-audit-ci.js

  # ═══════════════════════════════════════════════════
  # JOB 3: API SECURITY CONTRACT
  # ═══════════════════════════════════════════════════
  api-security-contract:
    name: API Security Contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/api-security-scan.js

  # ═══════════════════════════════════════════════════
  # JOB 4: LINT + TYPECHECK
  # ═══════════════════════════════════════════════════
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit

  # ═══════════════════════════════════════════════════
  # JOBS 5-13: INDEPENDENT TEST CATEGORIES
  # Each runs in parallel on fresh runners with dedicated memory.
  # ═══════════════════════════════════════════════════

  test-unit:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run unit tests
        run: npx vitest run --config vitest.unit.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-security:
    name: "Security Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run security tests
        run: npx vitest run --config vitest.security.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-api:
    name: "API Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_test
          POSTGRES_PASSWORD: ci_test_pass
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://ci_test:ci_test_pass@localhost:5432/ci_test
      - name: Seed CI test data
        run: npx tsx scripts/seed-ci.ts
        env:
          DATABASE_URL: postgresql://ci_test:ci_test_pass@localhost:5432/ci_test
      - name: Run API tests
        run: npx vitest run --config vitest.api.config.ts
        env:
          CI: 'true'
          DATABASE_URL: postgresql://ci_test:ci_test_pass@localhost:5432/ci_test
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-database:
    name: "Database Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run database tests
        run: npx vitest run --config vitest.database.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-ai:
    name: "AI Engine Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run AI core tests
        run: npx vitest run --config vitest.ai.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-ai-governance:
    name: "AI Governance Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run AI governance tests
        run: npx vitest run --config vitest.ai-governance.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-ai-retrieval:
    name: "AI Retrieval Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run AI retrieval tests
        run: npx vitest run --config vitest.ai-retrieval.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-ai-framework:
    name: "AI Framework Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run AI framework tests
        run: npx vitest run --config vitest.ai-framework.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-ai-inference:
    name: "AI Inference Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run AI inference tests
        run: npx vitest run --config vitest.ai-inference.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=2048'

  test-integration:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run integration tests
        run: npx vitest run --config vitest.integration.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=3072'

  test-e2e:
    name: "E2E Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run E2E tests
        run: npx vitest run --config vitest.e2e.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=3072'

  test-performance:
    name: "Performance Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run performance tests
        run: npx vitest run --config vitest.performance.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'

  test-ui:
    name: "UI Component Tests"
    runs-on: ubuntu-latest
    needs: [security-gate, api-security-contract]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Run UI tests
        run: npx vitest run --config vitest.ui.config.ts
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=3072'

  # ═══════════════════════════════════════════════════
  # FINAL JOB: BUILD VERIFICATION
  # ═══════════════════════════════════════════════════
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - test-unit
      - test-security
      - test-api
      - test-database
      - test-ai
      - test-ai-governance
      - test-ai-retrieval
      - test-ai-framework
      - test-ai-inference
      - test-integration
      - test-e2e
      - test-performance
      - test-ui
      - dependency-audit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build:vercel
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@localhost:5432/ci_test' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-test-secret-for-build-only-long-enough-32chars!!' }}
          API_KEY_ENCRYPTION_KEY: ${{ secrets.API_KEY_ENCRYPTION_KEY || 'ci-test-encryption-key-min-32-bytes-ok!' }}
